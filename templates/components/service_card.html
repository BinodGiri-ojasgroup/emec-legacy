{% comment %}Usage: {% include "components/service_card.html" with service=service %}{% endcomment %}
<a href="{{ service.get_absolute_url }}" class="card-link" data-reveal>
  <div class="card">
    {% if service.category %}<div class="eyebrow mb-1">{{ service.category.name }}</div>{% endif %}
    <div class="card-title">{{ service.title }}</div>
    <p class="text-muted mt-1">{{ service.summary }}</p>
  </div>
</a>
