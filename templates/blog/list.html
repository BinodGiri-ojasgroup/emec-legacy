{% extends "base.html" %}
{% block title %}News — {{ site_config.short_name }}{% endblock %}
{% block content %}
<section class="container section">
  <h1 class="page-title" data-reveal>News &amp; Insights</h1>
  <div class="grid grid-3 grid-gap-lg mt-6">
    {% for post in posts %}
      {% include "components/post_card.html" with post=post %}
    {% empty %}
      <p class="empty-note">No posts published yet.</p>
    {% endfor %}
  </div>
</section>
{% endblock %}
